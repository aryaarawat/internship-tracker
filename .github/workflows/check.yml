name: Check job boards
on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check boards and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python tracker/check.py
      - name: Commit updated data
        run: |
          git config user.name "tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/postings.json
          git diff --cached --quiet || git commit -m "Update postings $(date -u +%FT%TZ)"
          git pull --rebase -q && git push
